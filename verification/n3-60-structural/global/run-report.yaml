  Pinned every inspected premise/artifact before use. Re-derived d_K>=4
  from the three-point non-singleton/linearity lower bound and an explicit
  degree-three Berge obstruction. Enumerated q profiles twice, first by
  fixed-length nondecreasing partitions and then by q-value histogram
  recursion. Enumerated point profiles twice, by excess partitions and
  excess histograms. Reconstructed d_H(uv)=e_L(P',Q') crossing semantics
  from primitive endpoint label sets after common-label deletion, and
  compared bit-mask enumeration with the structural active-row/active-column
