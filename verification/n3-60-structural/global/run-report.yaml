  square minimum. Covered every finite exclusion case explicitly and ran
  hostile endpoint, graph, profile, canonicalization, and histogram
  mutations. Only after the independent derivation was encoded did the
  checker compare its canonical profile set, crossing rows, and m=29 moments
  with the submitted Wave19 JSON.
