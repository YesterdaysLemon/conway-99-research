  status: VERIFIED_UNUSED_SIMPLIFICATION
  statement: >-
    Once E has a nonempty proper coordinate block I, that block is a
    projector with rank equal to trace 4|I|/21, so 21 divides |I|.
    Together with the commutator consequence 33 divides |I|, this forces
    231 divides |I| and gives the contradiction directly.
