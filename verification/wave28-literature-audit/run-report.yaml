limitations:
  - Web and bibliographic discovery is not a complete proof of the literature universe.
  - No direct authenticated zbMATH connector was available.
  - The official Brouwer strongly regular graph table URL failed web safe-open and was not used as evidence.
  - Source hashes identify the read-only response bodies inspected at access time; they do not make mutable web pages immutable.
  - The audit verifies source attribution and theorem hypotheses, not the repository's arithmetic computations.
  - Catalogue fields support only the data they explicitly state; derived matrix properties remain delegated to exact verifiers.
  - No direct prior-art hit does not establish novelty.
  - No graph, endpoint lattice, projector frame, or Conway configuration is constructed or excluded.
  - srg(99,14,1,2), n3=708, and Wave 28 novelty remain UNKNOWN.
