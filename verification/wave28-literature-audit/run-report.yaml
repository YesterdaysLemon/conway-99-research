  numbered theorem restatements, and page-level definitions; separated
  exact current-status evidence, standard ingredients, nearby results
  with unmet hypotheses, and no-direct-match outcomes. Retained only
  bibliographic metadata, URLs, access dates, source notes, and SHA-256
  response hashes; no raw HTML or paper copies were retained. Compared
  literature attributions against the independent Wave 28 verifier's
  mandatory correction concerning order-21 invariant factors.
