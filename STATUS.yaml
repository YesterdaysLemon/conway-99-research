  caveat: "Wave 27 verifies an exact A2-direct-summand-free abstract h=9 arithmetic/lattice survivor and the unrestricted local E6 trace minimum 14, but the full endpoint projector/Schur identities make this explicit survivor impossible because it has orthogonal E6 summands. The core tensor screen excludes orthogonal A6 and E6 and intentionally leaves A20 orthogonal-sum E8^3; the separately frozen and verified A20 trace addendum then excludes that survivor. Hence, conditional on n3=708, the full projector/Schur endpoint identities, and the additional hypothesis that S is an orthogonal direct sum of irreducible ADE root lattices, no such S exists. General even rank-44 scaled-dual lattices, nonorthogonal root subsystems, n3=708, Conway-99 existence, and novelty remain UNKNOWN; the headline bound remains n3>=708."
